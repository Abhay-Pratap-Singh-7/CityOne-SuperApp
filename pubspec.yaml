name: cityoneapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#F9C123"
  image: assets/icon/icon.png

  android_12:
    color: "#F9C123"
    image: assets/icon/icon.png


flutter:
  uses-material-design: true
  assets:
    - assets/welcome_screen/

  fonts:
    - family: comfortaa
      fonts:
        - asset: assets/fonts/comfortaa.ttf
        - asset: assets/fonts/fredoka.ttf